name: Deploy to Render (Docker Publish)

on:
  push:
    branches:
      - feature/studio-workflow
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: yarn install

      - name: Build Web
        run: yarn workspace @affine/web build
        env:
          BUILD_TYPE: stable

      - name: Build Admin
        run: yarn workspace @affine/admin build
        env:
          BUILD_TYPE: stable

      - name: Build Mobile
        run: yarn workspace @affine/mobile build
        env:
          BUILD_TYPE: stable

      - name: Build Server Native
        run: yarn workspace @affine/server-native build

      - name: Build Server
        run: yarn workspace @affine/server build

      - name: Install Production Node.js dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
          yarn workspace @affine/server prisma generate
          mv ./node_modules ./packages/backend/server

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest
